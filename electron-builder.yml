appId: com.ztexam.app
productName: ZT-Exam
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
# ไบนารี native ทั้งหมด (better-sqlite3 / os_guard) จะถูก unpack ออกนอก asar
# และถูกครอบ hash ใน app-manifest.sig.json เสมอ (scripts/sign-manifest.ts)
asarUnpack:
  - "**/*.node"
extraResources:
  - from: native/build/Release
    to: native
    filter:
      - "*.node"
afterPack: ./scripts/afterpack.mjs
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
    - deb
npmRebuild: true
# Electron Fuses (Phase 4.5 — เซ็ตซ้ำ/ตรวจซ้ำโดย scripts/apply-fuses.ts ผ่าน afterPack)
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
