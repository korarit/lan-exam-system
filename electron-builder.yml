appId: com.ztexam.app
productName: ZT-Exam
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
    - deb
npmRebuild: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
